<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cerca carte - Swappr</title>
<meta name="description" content="Swappr: sfoglia tutte le carte Pokémon, crea i tuoi binder e la tua wishlist e scambia con altri collezionisti.">
<link rel="stylesheet" href="swappr.css">
</head>
<body>
<main id="app"><noscript><p class="notice">Per usare Swappr serve JavaScript attivo nel browser.</p></noscript></main>
<script src="swappr.js"></script>
<script>
const S=Swappr,el=S.el,P=new URLSearchParams(location.search),app=document.getElementById('app');
const q=(P.get('q')||'').trim(),set=P.get('set')||'',rar=P.get('rar')||'',sup=P.get('sup')||'',all=P.get('all');
const natural=(a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true});
function sec(t,ic){const h=el('h2','sec');h.appendChild(el('span','',t));if(ic){const i=el('span','ic');i.innerHTML=S.IC[ic];h.appendChild(i);}app.appendChild(h);}
function results(){
  app.appendChild(el('h1','','Risultati'));
  const row=el('div','row');row.style.marginBottom='12px';
  if(q)row.appendChild(el('span','tag info','“'+q+'”'));
  if(rar)row.appendChild(el('span','tag',rar));
  if(sup)row.appendChild(el('span','tag',sup));
  if(set){const sc=el('span','tag info',set);row.appendChild(sc);S.sets().then(a=>{const s=a.find(x=>x.id===set);if(s)sc.textContent=s.name;}).catch(()=>{});}
  const cnt=el('span','sub');row.appendChild(cnt);
  const rs=el('a','btn small ghost','Azzera');rs.href='index.html';row.appendChild(rs);
  app.appendChild(row);
  const grid=el('div','cards'),sent=el('div','sentinel');app.append(grid,sent);
  let list=null;
  const loader=set?async page=>{
    if(!list){list=[];for(let p=1;;p++){const r=await S.cards({name:q,set,rarity:rar,supertype:sup,page:p,size:250});list.push(...r.cards);if(p*250>=r.total)break;}list.sort(natural);}
    return{cards:list.slice((page-1)*48,page*48),total:list.length};
  }:page=>S.cards({name:q,rarity:rar,supertype:sup,page,size:48});
  S.feed(grid,sent,loader,null,t=>{cnt.textContent=t+' carte trovate';});
}
async function home(){
  const bn=el('p','banner');bn.append('Swappr è in Beta · ');const a=el('a','',"Iscriviti per l'accesso");a.href='beta.html';bn.appendChild(a);app.appendChild(bn);
  sec('Ultime uscite');
  const g1=el('div','cards');app.appendChild(g1);const rm1=S.skel(g1,14);
  S.cards({size:14}).then(r=>{rm1();r.cards.forEach(c=>g1.appendChild(S.tile(c)));}).catch(()=>{rm1();g1.appendChild(el('div','empty',S.NODATA));});
  const more=el('a','btn ghost wide','Sfoglia tutte le carte →');more.href='index.html?all=1';app.appendChild(more);
  sec('Le più ricercate','trend');
  app.appendChild(el('p','sub','Classifica basata sulle wishlist. Utenti e dati dimostrativi finché gli account non sono attivi.'));
  const g2=el('div','cards big');g2.style.marginTop='10px';app.appendChild(g2);
  const top=S.mostWanted(6),rm2=S.skel(g2,6);
  try{
    const m=await S.byIds(top);rm2();
    top.forEach(id=>{
      const c=m[id];if(!c)return;
      const w=el('div','mw');w.appendChild(S.tile(c));
      const o=el('div','owners');
      S.owners(id).slice(0,2).forEach(u=>{const l=el('a','owner',u);l.href='profilo.html?u='+encodeURIComponent(u);o.appendChild(l);});
      w.appendChild(o);g2.appendChild(w);
    });
  }catch(e){rm2();g2.appendChild(el('div','empty',S.NODATA));}
}
(q||set||rar||sup||all)?results():home();
</script>
</body>
</html>
