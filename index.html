<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swappr</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
    }
    .logo-container {
      text-align: center;
      padding: 20px;
    }
    .logo {
      max-width: 320px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Swappr Logo" class="logo">
  </div>
</body>
</html>
