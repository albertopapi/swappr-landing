<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wishlist - Swappr</title>
<meta name="description" content="La tua wishlist su Swappr: le carte che desideri.">
<link rel="stylesheet" href="swappr.css">
<script>try{var t=JSON.parse(localStorage.getItem('swappr-theme-v1'));document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}</script>
</head>
<body>
<main id="app"><noscript><p class="notice">Per usare Swappr serve JavaScript attivo nel browser.</p></noscript></main>
<script src="swappr.js"></script>
<script>
const S=Swappr,el=S.el,app=document.getElementById('app');
app.appendChild(el('h1','','La mia wishlist'));
app.appendChild(el('p','sub','Le carte che desideri: Swappr le cerca nei binder degli altri collezionisti.'));
const mine=el('div','cards');app.appendChild(mine);
const add=el('button','btn ghost wide','Aggiungi carte');add.type='button';
add.onclick=()=>S.picker('Aggiungi alla wishlist',c=>{if(!S.inWish(c.id))S.toggleWish(c);draw();});
app.appendChild(add);
function draw(){
  mine.replaceChildren();const w=S.wish();
  if(!w.length){mine.appendChild(el('div','empty','La tua wishlist è vuota. Cerca una carta e tocca il cuore.'));return;}
  w.forEach(c=>mine.appendChild(S.tile(c,{onWish:()=>draw()})));
}
draw();
(async()=>{
  let m={};try{m=await S.byIds([...new Set(S.DEMO.flatMap(u=>u.w))]);}catch(e){}
  S.DEMO.forEach(u=>{
    const h=el('h2','sec'),a=el('a','plain','Wishlist di '+u.u);a.href='profilo.html?u='+encodeURIComponent(u.u);h.appendChild(a);app.appendChild(h);
    const g=el('div','cards');u.w.forEach(id=>{if(m[id])g.appendChild(S.tile(m[id]));});app.appendChild(g);
  });
  app.appendChild(el('p','sub','Anteprima: le wishlist degli altri utenti sono dimostrative.'));
})();
</script>
</body>
</html>
