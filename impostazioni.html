<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impostazioni - Swappr</title>
<meta name="description" content="Impostazioni di Swappr: lingua, tema, informazioni e backup.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="swappr.css?v=10">
<script>try{var t=JSON.parse(localStorage.getItem('swappr-theme-v1'));document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}</script>
</head>
<body>
<main id="app" class="narrow"><noscript><p class="notice">Per usare Swappr serve JavaScript attivo nel browser.</p></noscript></main>
<script src="swappr-config.js"></script>
<script src="swappr.js?v=10"></script>
<script src="js/impostazioni.js?v=10"></script>
</body>
</html>
