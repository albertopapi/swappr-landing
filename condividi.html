<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liste condivise - Swappr</title>
<link rel="stylesheet" href="swappr.css">
</head>
<body>
<main>
  <h1 id="who">Liste condivise</h1>
  <p class="lead">Questa è una lista condivisa da un collezionista Swappr. Puoi solo consultarla.</p>
  <div class="two">
    <section class="panel"><h2>Carte che ha</h2><div id="have"></div></section>
    <section class="panel"><h2>Carte che cerca</h2><div id="want"></div></section>
  </div>
  <div class="actions"><a class="btn" href="binder.html">Crea il tuo binder</a><a class="btn ghost" href="match.html">Trova scambi</a></div>
</main>
<footer>© 2026 Swappr. Tutti i diritti riservati.</footer>
<script src="swappr.js"></script>
<script>
const $=id=>document.getElementById(id), el=Swappr.el, cut=(v,n)=>String(v==null?'':v).slice(0,n);
function fill(id,rows,haveCond){
  const box=$(id);
  if(!rows.length){box.appendChild(el('p','sub','Nessuna carta.'));return;}
  rows.forEach(r=>{
    if(!Array.isArray(r))return;
    const qty=Math.min(999,Math.max(1,parseInt(haveCond?r[3]:r[2],10)||1));
    const line=el('div','rowline');
    line.append(el('span','',cut(r[0],80)+(r[1]?' · '+cut(r[1],60):'')),el('strong','',(haveCond&&r[2]?cut(r[2],4)+' ':'')+'×'+qty));
    box.appendChild(line);
  });
}
try{
  const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
  const h=(Array.isArray(d.h)?d.h:[]).slice(0,500),w=(Array.isArray(d.w)?d.w:[]).slice(0,500);
  if(!h.length&&!w.length)throw new Error('vuoto');
  $('who').textContent='Liste condivise'+(d.u?' da '+cut(d.u,20):'');
  fill('have',h,true);fill('want',w,false);
}catch(e){
  $('who').textContent='Link non valido o incompleto';
  $('have').appendChild(el('p','sub','Chiedi di nuovo il link a chi te lo ha inviato.'));
}
</script>
</body>
</html>
