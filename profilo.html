<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profilo - Swappr</title>
<meta name="description" content="Il tuo profilo da collezionista su Swappr.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://images.pokemontcg.io">
<link rel="preconnect" href="https://api.pokemontcg.io" crossorigin>
<link rel="stylesheet" href="swappr.css?v=8">
<script>try{var t=JSON.parse(localStorage.getItem('swappr-theme-v1'));document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}</script>
</head>
<body>
<main id="app"><noscript><p class="notice">Per usare Swappr serve JavaScript attivo nel browser.</p></noscript></main>
<script src="swappr-config.js"></script>
<script src="swappr.js?v=8"></script>
<script>
const S=Swappr,el=S.el,P=new URLSearchParams(location.search),app=document.getElementById('app');
const C=window.SWAPPR_CONFIG||{},REMOTE=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY),who=P.get('u');
const btn=(t,fn,cls)=>{const x=el('button','btn small'+(cls?' '+cls:''),t);x.type='button';x.onclick=fn;return x;};
const stat=(n,l)=>{const s=el('span','sub');s.appendChild(el('b','',String(n)));s.append(' ');s.appendChild(el('span','',l));return s;};
const msgEl=()=>{const m=el('p','msg');m.setAttribute('role','status');m.setAttribute('aria-live','polite');return m;};
const colorOf=u=>u&&u.avatar&&/^#[0-9a-f]{6}$/i.test(u.avatar.c||'')?u.avatar.c:'';
function head(u,extra){
  const h=el('div','phead');h.appendChild(S.avatar(u.username,{big:true,color:colorOf(u)}));
  const t=el('div');t.appendChild(el('h1','',u.username));if(extra)t.appendChild(extra);h.appendChild(t);app.appendChild(h);
}
function binders(title,items){
  app.appendChild(el('h2','sec',title));
  if(!items.length){app.appendChild(el('p','sub','Nessun binder.'));return;}
  app.appendChild(S.rail(items.map(i=>S.cover(i[0],i[1],i[2],i[3]))));
}
function wishRail(title,cards,opt){
  app.appendChild(el('h2','sec',title));
  if(!cards.length){app.appendChild(el('p','sub','Nessuna carta.'));return;}
  app.appendChild(S.rail(cards.map(c=>S.tile(c,opt))));
}

/* --- account (Supabase se configurato, altrimenti profilo salvato su questo dispositivo) --- */
async function api(path,method,body,token){
  const h={apikey:C.SUPABASE_ANON_KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(C.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('Error '+r.status));
  return j;
}
const sess=()=>S.get('session',null);
const saveSession=j=>S.set('session',{access_token:j.access_token,refresh_token:j.refresh_token});
function applyUser(u){const md=u.user_metadata||{};S.set('user',{username:md.username||(u.email||'user').split('@')[0],city:md.city||'',bio:md.bio||'',avatar:md.avatar||null,email:u.email,remote:true});}
async function restore(){
  const s=sess();if(!s||!REMOTE)return;
  try{applyUser(await api('user','GET',null,s.access_token));}
  catch(e){try{const j=await api('token?grant_type=refresh_token','POST',{refresh_token:s.refresh_token});saveSession(j);applyUser(j.user);}catch(e2){S.set('session',null);S.set('user',null);}}
}
function loginForm(){
  app.replaceChildren();app.appendChild(el('h1','','Accedi'));
  const box=el('section','panel');
  box.innerHTML='<form id="f"><div class="form-grid"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div></div><div class="actions"><button class="btn" type="submit">Accedi</button></div></form>';
  const m=msgEl();box.querySelector('.actions').appendChild(m);app.appendChild(box);
  const b=el('a','sub','Crea un nuovo profilo');b.href='#';b.onclick=e=>{e.preventDefault();wizard();};app.appendChild(b);
  box.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{const j=await api('token?grant_type=password','POST',{email:box.querySelector('#email').value.trim(),password:box.querySelector('#pw').value});saveSession(j);applyUser(j.user);location.href='profilo.html';}catch(err){m.textContent=err.message;}};
}
/* --- creazione del profilo in tre passi --- */
const nameError=n=>!/^[A-Za-z0-9_]{3,20}$/.test(n)?'Almeno 3 caratteri: lettere, numeri e _.':(S.DEMO.some(u=>u.u.toLowerCase()===n.toLowerCase())?'Questo nome è già preso.':'');
function wizard(old){
  app.replaceChildren();
  const st={username:old?old.username:'',avatar:{c:colorOf(old)||S.AVC[0]},city:old&&old.city||'',bio:old&&old.bio||'',email:'',pw:''};
  const needAcc=REMOTE&&!old,total=3;let step=1;
  app.appendChild(el('h1','',old?'Modifica profilo':'Crea il profilo'));
  if(!old)app.appendChild(el('div','notice',REMOTE?"Accedi o crea un account: i dati dell'account sono gestiti da Supabase.":'Modalità anteprima: il profilo è salvato solo su questo dispositivo, senza password. Per attivare i veri account compila swappr-config.js con i dati di Supabase.'));
  const box=el('section','panel');app.appendChild(box);
  if(needAcc){const l=el('a','sub','Ho già un account');l.href='#';l.onclick=e=>{e.preventDefault();loginForm();};app.appendChild(l);}
  const field=(label,id,val,max,type)=>{const f=el('div','field'),l=el('label','',label);l.htmlFor=id;const i=document.createElement(type==='area'?'textarea':'input');i.id=id;if(type&&type!=='area')i.type=type;i.maxLength=max;i.value=val;f.append(l,i);return[f,i];};
  function draw(){
    box.replaceChildren();
    const pg=el('div','pg');for(let k=1;k<=total;k++)pg.appendChild(el('span',k<=step?'on':''));box.append(pg,el('p','sub','Passo '+step+' di '+total));
    const m=msgEl();let next=()=>'';
    if(step===1){
      box.append(el('h2','','Come ti chiami?'),el('p','sub','Scegli il tuo nome utente: lo vedranno gli altri collezionisti.'));
      const[f,i]=field('Nome utente','un',st.username,20);i.autocomplete='off';f.style.marginTop='14px';box.appendChild(f);
      i.oninput=()=>{st.username=i.value.trim();m.textContent='';};
      next=()=>nameError(st.username);
    }else if(step===2){
      box.appendChild(el('h2','','Scegli il colore del tuo avatar'));
      const pv=el('div');pv.style.margin='14px 0 4px';pv.appendChild(S.avatar(st.username||'?',{big:true,color:st.avatar.c}));box.appendChild(pv);
      const sw=el('div','sws');
      S.AVC.forEach((c,k)=>{const b=el('button');b.type='button';b.style.background=c;b.setAttribute('aria-label',S.AVN[k]);b.setAttribute('aria-pressed',String(st.avatar.c===c));b.onclick=()=>{st.avatar.c=c;draw();};sw.appendChild(b);});
      box.appendChild(sw);
    }else{
      box.appendChild(el('h2','',"Un po' di te"));
      const grid=el('div','form-grid');grid.style.marginTop='14px';
      const[fc,ic]=field('Città (facoltativa)','ct',st.city,40);ic.oninput=()=>{st.city=ic.value;};grid.appendChild(fc);box.appendChild(grid);
      const[fb,ib]=field('Descrizione (facoltativa)','bio',st.bio,140,'area');const cnt=el('p','sub',st.bio.length+'/140');ib.oninput=()=>{st.bio=ib.value;cnt.textContent=ib.value.length+'/140';};fb.style.marginTop='12px';box.append(fb,cnt);
      if(needAcc){
        const g2=el('div','form-grid');g2.style.marginTop='12px';
        const[fe,ie]=field('Email','email',st.email,120,'email');ie.autocomplete='email';ie.oninput=()=>{st.email=ie.value.trim();};
        const[fp,ip]=field('Password','pw',st.pw,72,'password');ip.autocomplete='new-password';ip.oninput=()=>{st.pw=ip.value;};
        g2.append(fe,fp);box.appendChild(g2);
        next=()=>(!st.email||st.pw.length<8)?'Email e password (almeno 8 caratteri) sono obbligatorie.':'';
      }
    }
    const act=el('div','actions');
    if(step>1)act.appendChild(btn('Indietro',()=>{step--;draw();},'ghost'));
    act.appendChild(btn(step<total?'Avanti':(needAcc?'Registrati':(old?'Salva profilo':'Crea il profilo')),async()=>{
      const e=next();if(e){m.textContent=e;return;}
      if(step<total){step++;draw();return;}
      await finish(m);
    }));
    act.appendChild(m);box.appendChild(act);
  }
  async function finish(m){
    const data={username:st.username,city:st.city.trim().slice(0,40),bio:st.bio.trim().slice(0,140),avatar:st.avatar};
    try{
      if(!REMOTE||(old&&!old.remote)){S.set('user',Object.assign({},old||{},{created:(old&&old.created)||Date.now()},data));location.href='profilo.html';return;}
      if(old){applyUser(await api('user','PUT',{data},sess().access_token));location.href='profilo.html';return;}
      const j=await api('signup','POST',{email:st.email,password:st.pw,data});
      if(j.access_token){saveSession(j);applyUser(j.user||j);location.href='profilo.html';}else m.textContent="Controlla la tua email per confermare l'account, poi accedi.";
    }catch(err){m.textContent=err.message;}
  }
  draw();
}
async function logout(){
  const me=S.me();
  if(me.remote){const s=sess();try{if(s)await api('logout','POST',null,s.access_token);}catch(e){}S.set('session',null);S.set('user',null);}
  else{if(!await S.confirm('Eliminare il profilo da questo dispositivo?','Binder e scambi restano salvati.','Elimina profilo',true))return;try{localStorage.removeItem('swappr-user-v1');}catch(e){}}
  location.href='profilo.html';
}
function firstSteps(){
  const items=[['Aggiungi una carta alla wishlist','wishlist.html',S.wish().length>0],['Metti una carta nel tuo binder di scambio','binder.html',Object.keys(S.haveCards()).length>0],['Guarda i tuoi match','scambi.html',S.matches().length>0||S.trades().length>0]];
  if(items.every(i=>i[2]))return;
  app.appendChild(el('h2','sec','Primi passi'));
  items.forEach(i=>{const a=el('a','item');a.href=i[1];const tx=el('span','tx');tx.appendChild(el('span','',i[0]));const c=el('span','chk'+(i[2]?' on':''));if(i[2])c.innerHTML=S.IC.check;a.append(c,tx);app.appendChild(a);});
}
function mine(){
  const me=S.me();if(!me)return wizard();
  const st=el('div','row');st.style.gap='18px';st.append(stat(0,'Follower'),stat(S.follows().length,'Segui'));
  head(me,st);
  if(me.city||me.bio){const t=el('div');if(me.city)t.appendChild(el('p','sub',me.city));if(me.bio)t.appendChild(el('p','',me.bio));t.style.margin='8px 0 4px';app.appendChild(t);}
  const act=el('div','row');act.style.margin='12px 0';
  act.append(btn('Modifica profilo',()=>wizard(me),'ghost'),btn(me.remote?'Esci':'Elimina profilo locale',logout,'danger'));app.appendChild(act);
  firstSteps();
  binders('I miei binder',S.binders().map(b=>[b.name,b.cards.reduce((s,e)=>s+e.qty,0),b.cards.length,'binder.html?b='+b.id]));
  wishRail('La mia wishlist',S.wish(),{onWish:()=>location.reload()});
}
async function demo(u){
  head({username:u.u},el('span','tag info','Utente di esempio'));
  const f=S.follows().includes(u.u),act=el('div','row');act.style.margin='12px 0';
  act.append(btn(f?'Non seguire più':'Inizia a seguire',()=>{S.toggleFollow(u.u);location.reload();},f?'ghost':''));
  const m=el('a','btn small ghost','Scrivi');m.href='messaggi.html?c='+encodeURIComponent(u.u);act.appendChild(m);app.appendChild(act);
  binders('Binder',u.b.map((b,i)=>[S.demoName(b[0]),b[1].length,b[1].length,'binder.html?u='+encodeURIComponent(u.u)+'&b='+i]));
  let mp={};try{mp=await S.byIds(u.w);}catch(e){}
  wishRail('Wishlist',u.w.map(id=>mp[id]).filter(Boolean));
}
(async()=>{
  const d=who&&S.DEMO.find(x=>x.u===who);
  if(d)return demo(d);
  if(REMOTE)await restore();mine();
})();
</script>
</body>
</html>
