<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata - Swappr</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#fff;color:#17130f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
@keyframes spin{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:5rem;display:inline-block;animation:spin 2.4s ease-in-out infinite;background:linear-gradient(#ffd23f,#ffd23f) no-repeat 0 88%/100% 38%}
p{color:#6b655b;margin:14px 0 26px}
a{background:#2b4eff;color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:12px;border:2px solid #17130f;box-shadow:3px 3px 0 #17130f;display:inline-block}
a:active{transform:translate(3px,3px);box-shadow:none}
@media(prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<h1>404</h1>
<p>Questa pagina non esiste o è stata spostata.</p>
<a href="/">Torna alla home</a>
</body>
</html>
