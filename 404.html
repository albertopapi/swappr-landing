<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata - Swappr</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/swappr.css?v=8">
<style>
body{padding-bottom:0}
.nf{margin:0 auto;padding:16vh 20px 40px;text-align:center;max-width:460px}
.nf img{display:block;margin:0 auto 22px;height:56px;width:auto}
.nf h1{margin-bottom:8px}
.nf p{color:var(--mut);margin-bottom:24px}
</style>
<script>try{var t=JSON.parse(localStorage.getItem('swappr-theme-v1'));document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}</script>
</head>
<body>
<main class="nf">
  <img src="/logo.png" alt="Swappr" width="56" height="56">
  <h1>Pagina non trovata</h1>
  <p>Questa pagina non esiste o è stata spostata.</p>
  <a class="btn" href="/">Torna alla home</a>
</main>
<script>try{if(JSON.parse(localStorage.getItem('swappr-lang-v1'))==='en'){document.documentElement.lang='en';document.title='Page not found - Swappr';document.querySelector('h1').textContent='Page not found';document.querySelector('.nf p').textContent='This page does not exist or has been moved.';document.querySelector('.btn').textContent='Back to home';}}catch(e){}</script>
</body>
</html>
